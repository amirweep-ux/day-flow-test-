name: Build Day Flow APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Locate project directory and build
        run: |
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found in repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Found project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          npm install
          npm run build

          npx cap add android

          # مجوزهای نوتیفیکیشن
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' android/app/src/main/AndroidManifest.xml || true

          npx cap sync android

          # بیلد نهایی فایل APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-apk
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
