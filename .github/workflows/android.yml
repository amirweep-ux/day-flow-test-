name: Build Day Flow APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-flow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android || true

      - name: Prepare foreground icon if missing
        run: |
          if [ -f "assets/icon-only.png" ] && [ ! -f "assets/icon-foreground.png" ]; then
            cp assets/icon-only.png assets/icon-foreground.png
          fi

      - name: Generate Android app icons
        run: npx @capacitor/assets generate --android || true

      - name: Android permissions for reminders
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' android/app/src/main/AndroidManifest.xml || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dayflow-apk
          path: day-flow/android/app/build/outputs/apk/debug/app-debug.apk
